<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff9e9">
<meta name="description" content="奇妙搭档，3–6 岁亲子共玩。">
<title>奇妙搭档 · 游戏小镇</title>
<style>:root { --ink:#254a34; --green:#246444; --paper:#fff8e5; --muted:#657255; --coral:#cb6143; }
* { box-sizing:border-box; }
html, body { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
body { display:grid; place-items:center; background:#e7edd9; color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",sans-serif; -webkit-tap-highlight-color:transparent; }
button, a { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
button { font:inherit; cursor:pointer; }
button:disabled { cursor:default; }
a { color:inherit; text-decoration:none; }
[hidden] { display:none !important; }
.app-frame { position:relative; width:100%; max-width:480px; height:100vh; height:100dvh; overflow:hidden; background:var(--paper); display:flex; flex-direction:column; }
.app-view { position:relative; isolation:isolate; flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
.brand-mark { display:inline-flex; width:38px; height:38px; flex-shrink:0; }
.brand-mark svg { display:block; width:100%; height:100%; }
.primary-button { min-height:54px; border:0; padding:14px 22px; border-radius:18px; background:var(--green); color:#fffbe8; font-size:18px; font-weight:800; box-shadow:0 5px 0 #194730; }
.primary-button:active { transform:translateY(3px); box-shadow:0 2px 0 #194730; }
/* The cover is an actual entry screen, not a banner above a feed. */
.cover-view { display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; padding:max(24px,env(safe-area-inset-top)) 20px max(32px,calc(env(safe-area-inset-bottom) + 20px)); background:linear-gradient(175deg,#fff5c7,#fff9e9 54%,#e7efce); }
.cover-brand { display:flex; align-items:center; justify-content:center; gap:11px; font-size:23px; font-weight:900; letter-spacing:1px; z-index:2; }
.cover-copy { position:relative; z-index:2; text-align:center; margin-top:clamp(14px,4vh,38px); }
.cover-copy h1 { margin:0; font-size:clamp(34px,5.6vh,48px); line-height:1.28; font-weight:900; letter-spacing:1px; }
.cover-copy em { color:var(--coral); font-style:normal; }
.cover-age { display:inline-block; font-size:12px; color:#697945; margin-top:14px; padding:7px 15px; background:#f4edbd; border:1px solid #ded6a3; border-radius:22px; }
.cover-scene { position:relative; min-height:0; width:calc(100% + 40px); margin-left:-20px; isolation:isolate; }
.cover-sun { position:absolute; width:55%; aspect-ratio:1; border-radius:50%; background:#ffe18a; top:9%; left:24%; z-index:-2; }
.cover-cloud { position:absolute; width:58px; height:17px; border-radius:30px; background:#fffef7; top:15%; z-index:-1; }
.cover-cloud:before { content:""; position:absolute; width:32px; height:28px; border-radius:50%; background:inherit; top:-12px; left:15px; }
.cloud-a { left:4%; transform:rotate(-5deg); }
.cloud-b { right:3%; top:30%; transform:scale(.7); }
.cover-path { position:absolute; bottom:2%; left:-12%; width:124%; height:30%; background:#dce8bc; border-radius:50% 50% 0 0; z-index:-1; }
#heroArt { position:absolute; inset:0 -5%; display:flex; align-items:flex-end; justify-content:center; padding-bottom:3%; }
#heroArt img { display:block; width:100%; height:100%; object-fit:contain; object-position:center bottom; }
.cover-flower { position:absolute; color:#e7b957; font-size:24px; z-index:2; }
.flower-a { left:8%; bottom:7%; transform:rotate(13deg); }
.flower-b { right:9%; bottom:13%; color:#f7fbdf; font-size:28px; }
.cover-action { padding:12px 13px 0; z-index:2; }
.cover-action .primary-button { width:100%; display:flex; justify-content:center; align-items:center; gap:38px; }
.cover-action .primary-button span { font-size:26px; line-height:1; }
/* Each app view owns a bounded viewport; cards are paged rather than clipped. */
.app-header { display:flex; align-items:center; gap:11px; flex:0 0 auto; min-height:62px; padding:max(10px,env(safe-area-inset-top)) 14px 7px; }
.app-header h2 { margin:0; font-size:21px; font-weight:850; flex:1; outline:none !important; }
.icon-button { display:grid; place-items:center; width:44px; height:44px; flex-shrink:0; border:1px solid #e2e4ca; background:#f1f1db; border-radius:15px; color:#54724a; padding:10px; }
.icon-button svg { width:22px; height:22px; overflow:visible; }
.recent-toggle[aria-pressed=true] { background:#dce9be; border-color:#8dab68; color:#2c623f; }
.lobby-body { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; padding:8px 16px 7px; }
.filters { flex-shrink:0; }
.filter-row { padding:0; margin:0; border:0; min-width:0; }
.filter-options { display:flex; gap:6px; min-width:0; }
#ageFilters { background:#ede9cf; border:1px solid #e0d6b2; border-radius:14px; padding:4px; width:max-content; max-width:100%; }
.filter-chip { min-height:42px; flex-shrink:0; padding:8px 17px; border:0; border-radius:10px; background:transparent; color:#637654; font-size:12px; font-weight:700; }
#ageFilters .filter-chip[aria-pressed=true] { background:var(--green); color:#fffbed; box-shadow:0 3px 0 #174b33; }
.filter-row + .filter-row { margin-top:10px; }
#interestFilters { overflow-x:auto; overflow-y:hidden; scrollbar-width:none; padding:3px 2px 4px; gap:2px; }
#interestFilters::-webkit-scrollbar { display:none; }
#interestFilters .filter-chip { flex:1 0 36px; min-width:36px; min-height:66px; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:2px 3px; gap:5px; font-size:11px; }
.interest-icon { width:34px; height:34px; padding:1px; background:#fff6d9; border:1px solid #dccda5; border-radius:13px; box-shadow:0 2px 0 #dfcea6; }
.interest-icon svg { display:block; width:100%; height:100%; }
#interestFilters .filter-chip[aria-pressed=true] .interest-icon { outline:2px solid var(--green); outline-offset:1px; background:#ffdd77; box-shadow:0 3px 0 #a6b67c; transform:translateY(-1px); }
#interestFilters .filter-chip[aria-pressed=true] { color:#2d613e; font-weight:850; }
.results-head { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; height:32px; font-size:12px; color:#6e795f; }
.text-button { border:0; background:transparent; min-height:32px; padding:5px 0 5px 12px; font-size:12px; color:#54744b; }
.text-button:disabled { visibility:hidden; }
.game-stage { flex:1; min-height:0; position:relative; }
.game-grid { display:grid; width:100%; height:100%; grid-template-columns:repeat(var(--cols,2),minmax(0,1fr)); grid-template-rows:repeat(var(--rows,3),minmax(0,1fr)); gap:10px; touch-action:pan-y; outline-offset:2px !important; }
.gameCard { position:relative; min-width:0; min-height:0; height:100%; display:flex; flex-direction:column; border:1.5px solid #e4cfa2; border-bottom:4px solid #dcb97e; border-radius:20px; overflow:hidden; background:#fffdf0; box-shadow:0 3px 0 #ad8c4d18,0 5px 12px #75663709; user-select:none; -webkit-user-select:none; }
.gameCard:active { transform:translateY(2px); box-shadow:0 1px 0 #eae2c7; }
.card-art { flex:1; min-height:0; margin:6px 6px 0; border-radius:13px; position:relative; background:radial-gradient(ellipse at 50% 100%,#e1c48435,transparent 65%),var(--tint); overflow:hidden; }
.card-art svg { width:100%; height:100%; display:block; overflow:hidden; filter:drop-shadow(0 2px 1px #8a683614); }
.card-art:after { content:none; }
.own-badge { position:absolute; right:5px; top:5px; width:21px; height:21px; display:grid; place-items:center; border:1px solid #7f9c5f; background:#fffdf0; border-radius:50%; color:#547441; font-size:12px; font-weight:800; }
.card-body { flex-shrink:0; padding:7px 9px 9px; min-width:0; }
.card-name { margin:0 0 3px; line-height:1.35; font-size:15px; font-weight:850; white-space:nowrap; }
.card-meta { display:flex; gap:5px; align-items:center; color:#748064; font-size:10px; line-height:1.4; white-space:nowrap; }
.meta-dot { color:#bec6a2; }
.pager { flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:24px; min-height:44px; }
.page-button { display:grid; place-items:center; width:44px; height:44px; border:0; border-radius:14px; background:var(--green); color:#fffbe7; box-shadow:0 3px 0 #174b33; font-size:29px; line-height:1; }
.page-button:disabled { background:#e6e6cb; color:#aab58e; box-shadow:none; opacity:.65; }
.page-status { min-width:88px; text-align:center; }
.page-dots { display:inline-flex; align-items:center; gap:7px; height:20px; }
.page-dots i { display:block; width:7px; height:7px; border-radius:8px; background:#d3ddba; }
.page-dots i.active { background:var(--green); width:20px; }
.empty { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1.5px dashed #d3dabb; border-radius:20px; background:#f1f2dc; padding:14px; text-align:center; }
.empty > span { font-size:31px; }
.empty h3 { font-size:16px; margin:13px 0 19px; }
.empty .primary-button { font-size:14px; min-height:44px; padding:10px 17px; border-radius:13px; }
.bottom-nav { display:flex; align-items:center; justify-content:center; gap:24px; flex:0 0 auto; padding:8px 12px max(10px,env(safe-area-inset-bottom)); border-top:1px solid #e5e5cb; background:#fff7df; }
.bottom-nav button { min-height:44px; min-width:128px; display:flex; align-items:center; justify-content:center; gap:8px; padding:8px 12px; border:0; border-radius:14px; background:transparent; color:#586f47; font-size:12px; font-weight:700; }
.bottom-nav button.active { background:#e1edc9; color:#225338; box-shadow:inset 0 0 0 1.5px #819e5e,0 3px 0 #c0d29a; }
.bottom-nav svg { width:23px; height:23px; flex-shrink:0; }
.badge-total { font-size:12px; color:#70815c; padding-right:6px; }
.badge-total strong { font-size:22px; color:#3a6943; margin-right:3px; }
.badge-body { flex:1; min-height:0; display:flex; flex-direction:column; padding:7px 14px 13px; gap:12px; }
.badge-grid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(var(--badge-rows,4),minmax(0,1fr)); gap:8px; }
.badgeCell { display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:0; min-height:0; border:1px solid #dfd1ae; border-bottom:3px solid #d4bd8d; background:#f3edda; border-radius:16px; padding:7px 3px; gap:4px; text-align:center; }
.badgeCell.earned { background:#fff0bd; border-color:#d7b15c; box-shadow:0 3px 0 #d6ba7c35; }
.badgeCell svg { flex:1; min-height:0; height:0; width:78px; max-width:90%; overflow:hidden; }
.badgeCell.locked svg { filter:grayscale(.72); opacity:.4; }
.badge-name { font-size:10px; line-height:1.4; font-weight:800; white-space:nowrap; }
.badge-status { font-size:9px; line-height:1.3; color:#758263; white-space:nowrap; }
.collection-progress { flex-shrink:0; display:flex; align-items:center; gap:13px; padding:9px 12px; border-radius:12px; background:#e4eccb; border:1px solid #c8d3a2; font-size:12px; font-weight:700; }
.growth-track { flex:1; height:6px; background:#d6dfbd; border-radius:8px; overflow:hidden; }
.growth-track span { display:block; height:100%; background:#7fa65e; border-radius:8px; width:0; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.view-enter { animation:view-in .22s ease both; }
@keyframes view-in { from { opacity:.3; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.promo-dialog { color:var(--ink); width:min(370px,calc(100vw - 28px)); max-height:calc(100dvh - 32px); overflow:auto; border:2px solid #d3dcbc; border-radius:28px; background:#fffbed; padding:28px 24px; box-shadow:0 20px 80px #263c3430; text-align:center; }
.promo-dialog::backdrop { background:#234c3a65; backdrop-filter:blur(5px); }

.promo-dialog h2 { font-size:23px; margin:22px 0 14px; }
.promo-dialog p { font-size:14px; line-height:1.9; color:var(--muted); }
.promo-dialog button { background:var(--green); color:white; border:0; border-radius:14px; min-height:46px; padding:11px 23px; font-weight:700; }
@media (max-width:350px) {
  .lobby-body { padding-left:12px; padding-right:12px; }
  .app-header { gap:8px; padding-left:10px; padding-right:10px; }
  .app-header h2 { font-size:20px; }
  .card-name { font-size:14px; }
  .bottom-nav { gap:17px; }
  .bottom-nav button { min-width:119px; }
  .cover-view { padding-left:16px; padding-right:16px; }
  .cover-scene { width:calc(100% + 32px); margin-left:-16px; }
}
@media (max-height:640px) and (orientation:portrait) {
  .cover-view { padding-top:max(16px,env(safe-area-inset-top)); padding-bottom:max(22px,calc(env(safe-area-inset-bottom) + 12px)); }
  .cover-brand { font-size:21px; }
  .cover-brand .brand-mark { width:32px; height:32px; }
  .cover-copy { margin-top:15px; }
  .cover-copy h1 { font-size:32px; }
  .cover-age { margin-top:9px; font-size:11px; padding:5px 12px; }
  .cover-action { padding-top:8px; }
  .cover-action .primary-button { min-height:49px; font-size:17px; }
  .app-header { min-height:56px; padding-top:6px; padding-bottom:4px; }
  .lobby-body { padding-top:4px; gap:6px; }
  .filter-row + .filter-row { margin-top:6px; }
  #interestFilters .filter-chip { min-height:59px; }
  .interest-icon { width:33px; height:33px; padding:1px; border-radius:11px; }
}
@media (max-height:500px) and (min-width:500px) {
  .app-frame { max-width:860px; }
  .cover-view { grid-template-columns:1fr 1fr; grid-template-rows:auto minmax(0,1fr) auto; padding:18px 28px 24px; gap:9px; }
  .cover-brand { grid-area:1/1; justify-content:flex-start; font-size:20px; }
  .cover-brand .brand-mark { width:31px; height:31px; }
  .cover-copy { grid-area:2/1; margin:0; align-self:center; text-align:left; }
  .cover-copy h1 { font-size:34px; }
  .cover-age { font-size:11px; padding:5px 10px; margin-top:10px; }
  .cover-scene { grid-area:1/2/4/3; width:calc(100% + 28px); margin:0; }
  .cover-action { grid-area:3/1; padding:0 10px 0 0; }
  .cover-action .primary-button { min-height:46px; font-size:16px; padding:11px 18px; }
  .app-header { min-height:46px; padding:2px 12px; }
  .app-header h2 { font-size:19px; }
  .icon-button { height:40px; width:40px; border-radius:13px; }
  .lobby-body { gap:5px; padding:4px 12px; }
  .filters { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:10px; align-items:center; }
  .filter-row + .filter-row { margin:0; }
  #ageFilters { padding:2px; }
  #ageFilters .filter-chip { min-height:40px; padding:7px 13px; font-size:11px; }
  #interestFilters { padding:3px; gap:5px; }
  #interestFilters .filter-chip { flex:0 0 66px; min-height:40px; flex-direction:row; gap:4px; font-size:11px; background:#edf0db; border-radius:11px; padding:5px; }
  .interest-icon { height:24px; width:24px; border:0; padding:0; border-radius:8px; }
  .results-head { height:27px; }
  .text-button { min-height:27px; }
  .game-grid { gap:9px; }
  .card-body { padding:5px 8px 7px; }
  .card-name { font-size:14px; margin-bottom:2px; }
  .card-meta { font-size:10px; }
  .pager { min-height:40px; }
  .page-button { height:40px; width:44px; border-radius:12px; }
  .bottom-nav { padding:4px 12px max(4px,env(safe-area-inset-bottom)); gap:34px; }
  .bottom-nav button { min-height:42px; padding:6px 12px; }
  .badge-body { padding:3px 12px 7px; gap:6px; }
  .badge-grid { grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:repeat(var(--badge-rows,3),minmax(0,1fr)); gap:5px; }
  .badgeCell { padding:4px 3px; gap:2px; border-radius:12px; }
  .badge-status { display:none; }
  .badge-name { font-size:10px; }
  .collection-progress { padding:6px 10px; }
}
@media (min-width:900px) and (min-height:650px) {
  .app-frame { height:calc(100dvh - 40px); max-height:920px; border-radius:30px; border:1px solid #d5dfc0; box-shadow:0 20px 70px #56734c21; }
}

/* Forest toy set: decoration stays behind bounded app screens. */
.art-defs { position:absolute; width:0; height:0; overflow:hidden; pointer-events:none; }
.toy-illustration { display:block; width:100%; height:100%; overflow:hidden; }
.lobby-view, .badge-view { background:linear-gradient(180deg,#fff3cd 0,#fff8e5 31%,#f5f2d8 100%); }
.forest-set { position:absolute; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.forest-canopy { position:absolute; top:-85px; width:175px; height:145px; border-radius:44% 56% 49% 51%; background:radial-gradient(ellipse at 38% 38%,#adc77c,#83a965 68%,#719653); box-shadow:inset 0 -6px 0 #61874625,0 6px 0 #7296530b; opacity:.28; }
.canopy-left { left:-113px; transform:rotate(-22deg); }
.canopy-right { right:-102px; top:-81px; transform:rotate(24deg); }
.forest-hill { position:absolute; width:130%; height:27%; bottom:-13%; border-radius:50% 50% 0 0; background:#d9e6b6; opacity:.8; }
.hill-left { left:-48%; transform:rotate(12deg); }
.hill-right { right:-56%; bottom:-12%; background:#cbdca0; transform:rotate(-15deg); }
.forest-trail { position:absolute; width:32%; height:32%; bottom:-14%; left:36%; border-radius:60% 20% 0 0; background:#f5e2ac; transform:rotate(21deg); opacity:.6; }
.forest-sprout { position:absolute; bottom:13px; width:12px; height:23px; background:#729952; border-radius:100% 0 100% 0; opacity:.45; }
.forest-sprout:after { content:''; position:absolute; width:12px; height:18px; background:#91ae65; border-radius:0 100% 0 100%; left:8px; top:6px; }
.sprout-left { left:3px; transform:rotate(-20deg); }
.sprout-right { right:12px; transform:rotate(12deg) scale(.8); }
.header-companion { display:block; width:48px; height:46px; flex:0 0 48px; overflow:hidden; align-self:flex-end; margin-left:-5px; }
.header-companion svg { transform-origin:50% 90%; }
.app-header { position:relative; }
.app-header h2 { letter-spacing:.5px; }
.icon-button { background:#fff5da; border-color:#e4d1a4; box-shadow:0 2px 0 #dec99d; color:#3f6b43; }
.recent-toggle[aria-pressed=true] { background:var(--green); color:#fffbe7; border-color:#174b33; box-shadow:0 2px 0 #174b33; }
.brand-mark { width:42px; height:42px; }
.cover-brand { color:var(--green); }
.cover-copy h1 { color:#28573a; }
.cover-copy em { color:var(--coral); }
.cover-age { color:#697346; background:#f4e9b1; }
.primary-button { background:linear-gradient(180deg,#307852,var(--green)); box-shadow:0 5px 0 #174b33,inset 0 1px 0 #ffffff30; }
.primary-button:active, .page-button:active:not(:disabled), .icon-button:active { transform:translateY(2px); }
.game-stage:before { content:''; position:absolute; inset:0 43%; background:repeating-linear-gradient(0deg,#ddc89650 0 8px,transparent 8px 18px); border-radius:35%; pointer-events:none; }
.card-body { background:linear-gradient(#fffdf0,#fff8e1); }
.card-name { color:#285338; }
.card-meta { color:#687454; }
.own-badge { background:#ffdf7b; border-color:#c49d3c; color:#325a36; }
.badge-total { background:#f8e5a6; padding:5px 9px; border-radius:13px; }
.empty { background:#f2edcfde; border-color:#b9c492; }
.empty-companion { display:block; width:85px; height:85px; }
.empty h3 { margin-top:10px; }
.promo-friends { width:170px; height:145px; margin:0 auto; }
.promo-dialog h2 { margin-top:10px; }
.header-companion.feedback-welcome svg { animation:bear-hello .75s ease both; }
.header-companion.feedback-peek svg { animation:rabbit-peek .85s cubic-bezier(.2,.75,.3,1) both; }
.header-companion.feedback-nod svg { animation:bear-nod .42s ease both; }
.header-companion.feedback-award svg { animation:prize-offer .85s cubic-bezier(.2,.75,.3,1) both; }
.game-grid.is-paging .gameCard { animation:toy-page-in .22s ease-out both; }
.badgeCell.new-award, .gameCard.new-award { animation:badge-glow .85s ease both; }
.promo-dialog[open] .promo-friends { animation:prize-offer .7s ease-out both; }
@keyframes bear-hello { 0% {transform:translateY(8px) rotate(-7deg)} 22% {transform:translateY(-2px) rotate(7deg)} 45% {transform:rotate(-6deg)} 67% {transform:rotate(4deg)} 100% {transform:none} }
@keyframes rabbit-peek { 0% {transform:translateY(95%)} 27%,67% {transform:translateY(0) rotate(-5deg)} 100% {transform:translateY(100%)} }
@keyframes bear-nod { 0%,100% {transform:none} 50% {transform:translateY(3px) rotate(-7deg)} }
@keyframes prize-offer { 0% {opacity:0;transform:translateY(12px) scale(.85)} 42% {opacity:1;transform:translateY(-3px) scale(1.06)} 100% {opacity:1;transform:none} }
@keyframes toy-page-in { from {opacity:.5;transform:translateX(calc(var(--page-direction,1) * 12px))} to {opacity:1;transform:none} }
@keyframes badge-glow { 0%,100% {filter:none} 45% {filter:brightness(1.12);box-shadow:0 0 0 3px #f0c56470} }
@media (max-width:350px) { .header-companion { width:42px; flex-basis:42px; height:43px; margin-left:-6px; } }

  function toy(index) {
    const col = index % 4, row = Math.floor(index / 4);

  }
  function art(g) {

  }

    const HOME_STATE = 'qmdd_home_state';
  let saved = QMDD.json(HOME_STATE, {});
  if (!saved || typeof saved !== 'object' || Array.isArray(saved)) saved = {};
  let recentOnly = !!saved.recentOnly;
  let filterMode = saved.filterVersion === 2 && saved.filterMode === 'interest' ? 'interest' : 'ability';
  let ability = saved.filterVersion === 2 && Object.prototype.hasOwnProperty.call(ABILITIES, saved.ability) ? saved.ability : 'all';
  if (filterMode === 'ability') interest = 'all'; else ability = 'all';
  let anchor = typeof saved.anchor === 'string' ? saved.anchor : null;
  let pageIndex = 0, pageSize = 6, filtered = [], view = 'cover', badgePage = 0;
  let suppressClickUntil = 0, gesture = null;
  const newAwards = new Set();
  let companionTimer, pageTimer;
  const SHORT = { all:'全部', observe:'寻找', build:'搭建', music:'音乐', story:'扮演', care:'陪伴', move:'动作' };

  function clearFeedback() {
    clearTimeout(companionTimer); clearTimeout(pageTimer);
    $('cardList').classList.remove('is-paging');
    for (const [id,index] of [['lobbyCompanion',12],['badgeCompanion',14]]) {
      const el=$(id); el.className='header-companion'; el.innerHTML=toy(index);
    }
  }
  function playCompanion(kind) {
    clearFeedback();
    if (QMDD.reducedMotion.matches || view==='cover') return;
    const el=$(view==='badges' ? 'badgeCompanion' : 'lobbyCompanion');
    el.innerHTML=toy(kind==='peek' ? 13 : kind==='award' ? 14 : 12);
    void el.offsetWidth;
    el.classList.add('feedback-'+kind);
    companionTimer=setTimeout(clearFeedback,900);
  }
  function animatePage(delta) {
    playCompanion('peek');
    if (QMDD.reducedMotion.matches) return;
    $('cardList').style.setProperty('--page-direction',delta);
    $('cardList').classList.add('is-paging');
    pageTimer=setTimeout(() => $('cardList').classList.remove('is-paging'),260);
  }
  function detectAwards() {
    const previous=QMDD.json('qmdd_home_badge_snapshot',null), current=Object.keys(QMDD.badges());
    if (Array.isArray(previous)) current.filter(id=>!previous.includes(id)).forEach(id=>newAwards.add(id));
    store.setItem('qmdd_home_badge_snapshot',JSON.stringify(current));
  }

  function saveState() {
    store.setItem('qmdd_age', age);
    store.setItem('qmdd_interest', interest);
    store.setItem(HOME_STATE, JSON.stringify({ anchor, recentOnly, filterMode, ability, filterVersion: 2 }));
  }
  function measure() {
    const r = $('appFrame').getBoundingClientRect();
    if (r.height <= 500 && r.width >= 500) return { size:3, cols:3 };
    if (r.height < 620) return { size:2, cols:2 };
    if (r.height < 760) return { size:4, cols:2 };
    return { size:6, cols:2 };
  }
  function countProgress() {
    const badges = QMDD.badges(), count = Object.keys(badges).length;
    const tier = TITLES.filter(([need]) => count >= need).length;
    $('earnedCnt').textContent = count;
    $('growthFill').style.width = count / GAMES.length * 100 + '%';
    $('curTitle').textContent = tier ? TITLES[tier - 1][1] : '奇妙萌新';
    return { badges, count, tier };
  }
  function cardMarkup(g, badges) {
    return `<a class="gameCard${newAwards.has(g.id) ? ' new-award' : ''}" href="${g.url}" data-id="${g.id}" aria-label="${g.name}，适合 ${g.age === '34' ? '3到4' : '5到6'} 岁，${g.time}${badges[g.id] ? '，已点亮徽章' : ''}"><div class="card-art" style="--tint:${CARD_TINTS[g.id]}">${art(g)}${badges[g.id] ? '<span class="own-badge" aria-hidden="true">✓</span>' : ''}</div><div class="card-body"><h3 class="card-name">${g.name}</h3><div class="card-meta"><span>${g.age === '34' ? '3–4' : '5–6'} 岁</span><span class="meta-dot" aria-hidden="true">·</span><span>${g.time}</span></div></div></a>`;
  }
  function renderCards() {
    const layout = measure(), recent = QMDD.recent();
    pageSize = layout.size;
    filtered = GAMES.filter(g => (age === 'all' || g.age === age) && (filterMode !== 'interest' || interest === 'all' || g.interests.includes(interest)) && (filterMode !== 'ability' || ability === 'all' || g.abilities.includes(ability)) && (!recentOnly || recent.includes(g.id)));
    if (recentOnly) filtered.sort((a,b) => recent.indexOf(a.id) - recent.indexOf(b.id));
    const found = filtered.findIndex(g => g.id === anchor);
    pageIndex = found >= 0 ? Math.floor(found / pageSize) : 0;
    const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
    pageIndex = Math.min(pageIndex, pages - 1);
    const visible = filtered.slice(pageIndex * pageSize, (pageIndex + 1) * pageSize);
    const rows = Math.max(1, Math.ceil(visible.length / layout.cols));
    $('cardList').style.setProperty('--cols', layout.cols);
    $('cardList').style.setProperty('--rows', rows);
    $('cardList').innerHTML = visible.map(g => cardMarkup(g, QMDD.badges())).join('');
    $('cardList').hidden = !visible.length;
    $('emptyState').hidden = !!visible.length;
    $('emptyTitle').textContent = recentOnly && !recent.length ? '先去玩一局吧' : '换个组合，再找找？';
    $('gamePager').hidden = !visible.length;
    $('prevPage').disabled = pageIndex === 0;
    $('nextPage').disabled = pageIndex === pages - 1;
    $('pageDots').innerHTML = Array.from({length:pages}, (_,i) => '<i class="' + (i === pageIndex ? 'active' : '') + '"></i>').join('');
    $('pageLabel').textContent = '第 ' + (pageIndex + 1) + ' 页，共 ' + pages + ' 页';
    $('cardList').setAttribute('aria-label', '游戏卡片，第 ' + (pageIndex + 1) + ' 页，共 ' + pages + ' 页');
    $('resultCount').textContent = (recentOnly ? '最近玩过 · ' : '') + filtered.length + ' 款游戏';
    $('resetFilters').disabled = age === 'all' && interest === 'all' && ability === 'all' && !recentOnly;
    $('recentToggle').setAttribute('aria-pressed', String(recentOnly));
    $('recentToggle').setAttribute('aria-label', recentOnly ? '查看全部游戏' : '只看最近玩过');
    document.querySelectorAll('[data-age]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.age === age)));
    document.querySelectorAll('[data-interest]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.interest === interest)));
    document.querySelectorAll('[data-ability]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ability === ability)));
    document.querySelectorAll('[data-filter-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filterMode === filterMode)));
    $('interestFilters').hidden = filterMode !== 'interest'; $('abilityFilters').hidden = filterMode !== 'ability';
    const categoryLabel = filterMode === 'interest' ? LABELS[interest] : ability === 'all' ? '全部能力' : ABILITIES[ability].label;
    $('filterStatus').textContent = (age === 'all' ? '全部年龄' : age === '34' ? '3–4 岁' : '5–6 岁') + '，' + categoryLabel + '，' + filtered.length + ' 款游戏';
    const track = $(filterMode === 'interest' ? 'interestFilters' : 'abilityFilters'), selected = track.querySelector('[aria-pressed="true"]');
    if (selected) track.scrollLeft = Math.max(0, selected.offsetLeft - track.offsetLeft - 8);
  }
  function changePage(delta) {
    const pages = Math.ceil(filtered.length / pageSize), next = pageIndex + delta;
    if (next < 0 || next >= pages) return;
    anchor = filtered[next * pageSize].id;
    saveState(); renderCards(); animatePage(delta);
  }
  function reset() { age = interest = ability = 'all'; recentOnly = false; anchor = null; saveState(); renderCards(); }
  function renderBadges() {
    const { badges } = countProgress();
    const perPage = 12, pages = Math.max(1, Math.ceil(GAMES.length / perPage));
    badgePage = Math.max(0, Math.min(badgePage, pages - 1));
    const visible = GAMES.slice(badgePage * perPage, (badgePage + 1) * perPage);
    const frame = $('appFrame').getBoundingClientRect();
    const cols = frame.height <= 500 && frame.width >= 500 ? 4 : 3;
    $('badgeGrid').style.setProperty('--badge-rows', Math.ceil(visible.length / cols));
    $('badgeGrid').innerHTML = visible.map(g => `<a class="badgeCell ${badges[g.id] ? 'earned' : 'locked'}${newAwards.has(g.id) ? ' new-award' : ''}" href="${g.url}" data-id="${g.id}" aria-label="${g.badgeName}，${badges[g.id] ? '已通关 ' + badges[g.id] + ' 次' : '尚未点亮'}，玩${g.name}">${art(g)}<span class="badge-name">${g.badgeName}</span>${badges[g.id] ? '<span class="badge-status">共玩 ' + badges[g.id] + ' 次</span>' : ''}</a>`).join('');
    $('badgePrev').disabled = badgePage === 0; $('badgeNext').disabled = badgePage >= pages - 1;
    $('badgePageLabel').textContent = (badgePage + 1) + ' / ' + pages;
    $('badgePager').hidden = pages <= 1;
    $('badgeTotal').textContent = GAMES.length;
  }
  $('badgePrev').addEventListener('click', () => { badgePage--; renderBadges(); });
  $('badgeNext').addEventListener('click', () => { badgePage++; renderBadges(); });
  function showView(next, options = {}) {
    clearFeedback();
    if (!['cover','lobby','badges'].includes(next)) next = 'cover';
    if ($('promoDialog').open) { acknowledgePromo(); $('promoDialog').close(); }
    view = next;
    for (const [key,id] of [['cover','coverView'],['lobby','lobbyView'],['badges','badgeView']]) {
      $(id).hidden = key !== view;
      $(id).classList.remove('view-enter');
    }
    const active = $(view === 'cover' ? 'coverView' : view === 'lobby' ? 'lobbyView' : 'badgeView');
    if (!QMDD.reducedMotion.matches) { void active.offsetWidth; active.classList.add('view-enter'); }
    $('mainNav').hidden = view === 'cover';
    $('navGames').classList.toggle('active', view === 'lobby');
    $('btnWall').classList.toggle('active', view === 'badges');
    for (const [id,active] of [['navGames',view==='lobby'],['btnWall',view==='badges']]) {
      if (active) $(id).setAttribute('aria-current','page'); else $(id).removeAttribute('aria-current');
    }
    if (view === 'lobby') renderCards();
    if (view === 'badges') renderBadges();
    if (options.route !== false) {
      const hash = '#' + view;
      if (location.hash !== hash) history[options.replace ? 'replaceState' : 'pushState'](null,'',hash);
    }
    if (options.focus !== false) (view === 'cover' ? $('enterLobby') : view === 'lobby' ? $('lobbyTitle') : $('wallTitle')).focus({preventScroll:true});
    if (view !== 'cover') {
      maybeCelebrate();
      if (newAwards.size) { if (!$('promoDialog').open) playCompanion('award'); newAwards.clear(); }
    }
  }
  function prepareGame(link, origin) {
    const id = link.dataset.id;
    if (origin === 'lobby') anchor = id;
    saveState();
    store.setItem('qmdd_home_badge_snapshot',JSON.stringify(Object.keys(QMDD.badges())));
    // All existing game pages return to ../index.html. Consume this once on that return.
    try { sessionStorage.setItem('qmdd_home_return', origin); } catch (_) {}
  }
  function acknowledgePromo() {
    if (pendingTier) { store.setItem('qmdd_last_title', String(pendingTier)); pendingTier = 0; }
  }
  function maybeCelebrate() {
    const { count, tier } = countProgress();
    const last = Math.max(0, Number(store.getItem('qmdd_last_title')) || 0);
    if (view === 'cover' || !tier || tier <= last || $('promoDialog').open) return;
    pendingTier = tier;
    $('promoTitle').textContent = '恭喜晋升：' + TITLES[tier - 1][1] + '！';
    $('promoDesc').textContent = count === GAMES.length ? GAMES.length + ' 枚徽章全部点亮。每一枚，都藏着你们一起玩过的好时光。' : '你们已点亮 ' + count + ' 枚徽章，还有 ' + (GAMES.length - count) + ' 枚等待发现。快和宝贝击个掌吧！';
    $('promoDialog').showModal();
  }
  $('interestFilters').innerHTML = INTERESTS.map(([id,label]) => `<button class="filter-chip" data-interest="${id}" aria-label="${label}" aria-pressed="${id === interest}"><span class="interest-icon" aria-hidden="true">${interestIcon(id)}</span><span>${SHORT[id]}</span></button>`).join('');
  $('abilityFilters').innerHTML = [['all',{label:'全部'}],...Object.entries(ABILITIES)].map(([id,info]) => `<button class="filter-chip" data-ability="${id}" aria-pressed="${id === ability}"><span class="interest-icon" aria-hidden="true">${id === 'all' ? toy(15) : art(BY_ID[info.art])}</span><span>${info.label}</span></button>`).join('');
  $('filterMode').addEventListener('click', e => { const b=e.target.closest('[data-filter-mode]'); if (!b || b.dataset.filterMode===filterMode) return; filterMode=b.dataset.filterMode; interest='all'; ability='all'; anchor=null; saveState(); renderCards(); });
  $('abilityFilters').addEventListener('click', e => { const b=e.target.closest('[data-ability]'); if (b && ability!==b.dataset.ability) { ability=b.dataset.ability; anchor=null; saveState(); renderCards(); playCompanion('nod'); } });
  $('enterLobby').addEventListener('click', () => { showView('lobby'); if (!$('promoDialog').open) playCompanion('welcome'); });
  $('backCover').addEventListener('click', () => showView('cover'));
  $('navGames').addEventListener('click', () => showView('lobby'));
  $('btnWall').addEventListener('click', () => showView('badges'));
  $('closeWall').addEventListener('click', () => showView('lobby'));
  $('recentToggle').addEventListener('click', () => { recentOnly = !recentOnly; anchor = null; saveState(); renderCards(); playCompanion('nod'); });
  $('ageFilters').addEventListener('click', e => { const b=e.target.closest('[data-age]'); if (b && age!==b.dataset.age) { age=b.dataset.age; anchor=null; saveState(); renderCards(); playCompanion('nod'); } });
  $('interestFilters').addEventListener('click', e => { const b=e.target.closest('[data-interest]'); if (b && interest!==b.dataset.interest) { interest=b.dataset.interest; anchor=null; saveState(); renderCards(); playCompanion('nod'); } });
  $('resetFilters').addEventListener('click', reset);
  $('emptyReset').addEventListener('click', reset);
  $('prevPage').addEventListener('click', () => changePage(-1));
  $('nextPage').addEventListener('click', () => changePage(1));
  $('cardList').addEventListener('keydown', e => { if (e.key==='ArrowRight' || e.key==='ArrowLeft') { e.preventDefault(); changePage(e.key==='ArrowRight' ? 1 : -1); $('cardList').focus({preventScroll:true}); } });
  $('cardList').addEventListener('click', e => {
    if (performance.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); return; }
    const link=e.target.closest('.gameCard'); if (link) prepareGame(link,'lobby');
  }, true);
  $('badgeGrid').addEventListener('click', e => { const link=e.target.closest('.badgeCell'); if (link) prepareGame(link,'badges'); });
  // A browser's native link drag cancels pointerup before the page gesture ends.
  $('cardList').addEventListener('dragstart', e => e.preventDefault());
  $('cardList').addEventListener('pointerdown', e => { if (e.isPrimary && e.button === 0) gesture={id:e.pointerId,x:e.clientX,y:e.clientY}; });
  window.addEventListener('pointerup', e => {
    if (!gesture || gesture.id !== e.pointerId) return;
    const dx=e.clientX-gesture.x, dy=e.clientY-gesture.y; gesture=null;
    if (Math.abs(dx)>48 && Math.abs(dy)<Math.abs(dx)*.55) { suppressClickUntil=performance.now()+400; changePage(dx<0 ? 1 : -1); }
  });
  window.addEventListener('pointercancel', () => { gesture=null; });
  $('closePromo').addEventListener('click', () => { acknowledgePromo(); $('promoDialog').close(); });
  $('promoDialog').addEventListener('cancel', acknowledgePromo);
  $('promoDialog').addEventListener('close', acknowledgePromo);
  $('promoDialog').addEventListener('keydown', e => { if (e.key==='Tab') { e.preventDefault(); $('closePromo').focus(); } });
  $('promoDialog').addEventListener('click', e => { const r=$('promoDialog').getBoundingClientRect(); if (e.target===$('promoDialog') && (e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom)) { acknowledgePromo(); $('promoDialog').close(); } });
  window.addEventListener('popstate', () => showView(location.hash.slice(1) || 'cover', {route:false}));
  window.addEventListener('hashchange', () => { const next=location.hash.slice(1)||'cover'; if (next!==view) showView(next,{route:false}); });
  let resizeFrame;
  new ResizeObserver(() => { cancelAnimationFrame(resizeFrame); resizeFrame=requestAnimationFrame(() => { if (view==='lobby') renderCards(); }); }).observe($('appFrame'));
  window.addEventListener('pageshow', e => { if (e.persisted) { try { sessionStorage.removeItem('qmdd_home_return'); } catch (_) {} detectAwards(); showView(view,{route:false,focus:false}); } });
  QMDD.reducedMotion.addEventListener('change', e => { if (e.matches) clearFeedback(); });
  window.addEventListener('storage', e => { if (e.key==='qmdd_badges' || e.key==='qmdd_recent') { if (view==='lobby') renderCards(); if (view==='badges') renderBadges(); maybeCelebrate(); } });
  let returnView;
  try { returnView=sessionStorage.getItem('qmdd_home_return'); sessionStorage.removeItem('qmdd_home_return'); } catch (_) {}
  if (['lobby','badges'].includes(returnView)) detectAwards();
  const initial = ['lobby','badges'].includes(returnView) ? returnView : location.hash.slice(1)||'cover';
  showView(initial,{replace:true,focus:false});

})();

</script>
</body>
</html>
